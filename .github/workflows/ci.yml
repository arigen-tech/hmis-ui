name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}

    - name: Verify API_HOST configuration
      run: |
        if grep -q "^export const API_HOST = 'https://api.arigenhmis.com/hims';" src/config/apiConfig.js; then
          echo "✅ API_HOST is correctly set for the dev branch."
        else
          echo "❌ ERROR: API_HOST is incorrectly configured in src/config/apiConfig.js!"
          echo "Please ensure it is set to: export const API_HOST = 'https://api.arigenhmis.com/hims';"
          exit 1
        fi

        
    - name: Install dependencies
      if: steps.cache-npm.outputs.cache-hit != 'true'
      run: npm install --no-audit --no-fund --prefer-offline --ignore-scripts

    - name: Build the project
      run: npm run build
      env:
        # Setting CI to false prevents warnings from failing the build on standard CRA
        CI: false
        # Setting GENERATE_SOURCEMAP to false drastically speeds up Webpack build times
        GENERATE_SOURCEMAP: false
